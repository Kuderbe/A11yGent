[project]
name = "a11y_gent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Benedikt Kuder (SAP)", email = "benedikt.kuder@sap.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "aiosqlite>=0.22.1",
    "mcp>=2.0,<3.0",
    "openai>=3.10.0",
    "python-dotenv>=1.2.3",
    "typer>=0.27.2",
]

[project.scripts]
a11y_gent = "a11y_gent.main:main"
a11y-gent-baseline = "a11y_gent.profiles.baseline.main:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
